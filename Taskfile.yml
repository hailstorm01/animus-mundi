# Developer commands for Card Town. Task is pinned as a tool in go.mod, so a
# fresh clone needs only Go:
#   go tool task <name>     (or `task <name>` if Task is installed)
#   go tool task            lists every task
# Pass extra flags after `--`, e.g. `go tool task sim -- -games 50`.
version: '3'

vars:
  BIN: bin/cardtown{{exeExt}}

tasks:
  default:
    desc: List the available tasks
    cmds:
      - '"{{.TASK_EXE}}" --list'
    silent: true

  build:
    desc: Build the cardtown CLI into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/cardtown

  test:
    desc: Run every Go test
    cmds:
      - go test ./... {{.CLI_ARGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go source in place
    cmds:
      - gofmt -w pkg cmd

  fmt-check:
    desc: Fail if any Go source needs gofmt
    cmds:
      - |
        if [ -n "$(gofmt -l pkg cmd)" ]; then
          gofmt -l pkg cmd
          echo "gofmt: the files above need formatting (run: go tool task fmt)"
          exit 1
        fi

  lint:
    desc: Run every cardtown linter (cardtown lint --all)
    deps: [build]
    cmds:
      - '{{.BIN}} lint --all'

  sim:
    desc: Play the Animus vs Path starter decks (cardtown sim)
    deps: [build]
    cmds:
      - '{{.BIN}} sim -deck starter -p0 ANIMUS -p1 PATH {{.CLI_ARGS}}'

  sim-log:
    desc: Play one starter game (the -seed one) and print its events (cardtown sim -log)
    deps: [build]
    cmds:
      - '{{.BIN}} sim -deck starter -p0 ANIMUS -p1 PATH -log {{.CLI_ARGS}}'

  sim-events:
    desc: Write the starter games' events as JSON Lines, e.g. `go tool task sim-events -- out.jsonl`
    deps: [build]
    cmds:
      - '{{.BIN}} sim -deck starter -p0 ANIMUS -p1 PATH -events {{.CLI_ARGS}}'

  sim-compare:
    desc: 'Pure-move check: the starter and stress sims print the same bytes and exit codes as a base ref (default main), e.g. `go tool task sim-compare -- main`'
    vars:
      REF: '{{.CLI_ARGS | default "main"}}'
      DIR: bin/sim-compare
    cmds:
      # Each side runs from its own checkout: cardtown reads data/ from the
      # working directory. Outputs stay in bin/sim-compare for the Log.
      - rm -rf {{.DIR}}
      - git worktree prune
      - git worktree add --detach {{.DIR}}/base {{.REF}}
      - defer: git worktree remove --force {{.DIR}}/base
      - go -C {{.DIR}}/base build -o ../base{{exeExt}} ./cmd/cardtown
      - go build -o {{.DIR}}/new{{exeExt}} ./cmd/cardtown
      - |
        out=$(pwd)/{{.DIR}}
        for side in base new; do
          if [ $side = base ]; then cd {{.DIR}}/base; fi
          "$out/$side{{exeExt}}" sim -deck starter -p0 ANIMUS -p1 PATH > "$out/$side-starter.txt" 2>&1
          echo "exit $?" >> "$out/$side-starter.txt"
          "$out/$side{{exeExt}}" sim > "$out/$side-stress.txt" 2>&1
          echo "exit $?" >> "$out/$side-stress.txt"
          cd "$out/../.."
        done
        fail=0
        for sim in starter stress; do
          git -c core.autocrlf=false diff --no-index --exit-code "$out/base-$sim.txt" "$out/new-$sim.txt" || fail=1
        done
        if [ $fail = 0 ]; then echo "[PASS] starter and stress sims match {{.REF}} byte for byte, exit codes included"; fi
        exit $fail

  play:
    desc: Play an interactive match against the bot (cardtown play)
    deps: [build]
    cmds:
      - '{{.BIN}} play -deck starter -p0 ANIMUS -p1 PATH {{.CLI_ARGS}}'

  check:
    desc: Every build-task Done-When gate (gofmt, vet, test, lint)
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: lint

  hook:
    desc: Install the pre-commit hook
    deps: [build]
    cmds:
      - '{{.BIN}} hook install'

  wave-run:
    desc: 'Build one wave unattended on an autoloop/ branch (lead-architect D7), e.g. `go tool task wave-run -- -Wave B -Tasks 3`'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File .agents/scripts/wave-run.ps1 {{.CLI_ARGS}}
